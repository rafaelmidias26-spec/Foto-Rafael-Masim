<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Eu Voto - Criador de Foto</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #0d0f12;
            color: #ffffff;
            min-height: 100vh;
        }

        header {
            text-align: center;
            padding: 30px 20px 20px;
        }

        header h1 {
            font-size: 30px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        header p {
            color: #9ea3aa;
            font-size: 15px;
        }

        .app {
            width: min(1200px, 95%);
            margin: auto;

            display: grid;
            grid-template-columns: 320px 1fr;

            gap: 25px;

            padding-bottom: 40px;
        }

        /* =========================
           PAINEL
        ========================= */

        .panel {
            background: #191c20;
            border-radius: 18px;

            padding: 22px;

            box-shadow:
                0 15px 40px rgba(0,0,0,.35);
        }

        .panel h2 {
            font-size: 19px;
            margin-bottom: 20px;
        }

        .upload-area {
            display: block;

            border: 2px dashed #50545b;
            border-radius: 14px;

            padding: 25px 15px;

            text-align: center;

            cursor: pointer;

            transition: .2s;

            margin-bottom: 25px;
        }

        .upload-area:hover {
            border-color: #ffffff;
            background: #22252a;
        }

        .upload-area strong {
            display: block;

            margin-bottom: 8px;

            font-size: 15px;
        }

        .upload-area span {
            color: #969ba3;
            font-size: 13px;
        }

        #photoInput {
            display: none;
        }

        /* =========================
           CONTROLES
        ========================= */

        .control {
            margin-bottom: 22px;
        }

        .control label {
            display: flex;

            justify-content: space-between;

            margin-bottom: 9px;

            font-size: 14px;

            color: #dddddd;
        }

        input[type="range"] {
            width: 100%;
            cursor: pointer;
        }

        .buttons {
            display: grid;
            gap: 10px;

            margin-top: 25px;
        }

        button {
            border: none;

            border-radius: 10px;

            padding: 13px;

            font-size: 14px;

            font-weight: bold;

            cursor: pointer;

            transition: .2s;
        }

        .btn-reset {
            background: #30343a;
            color: #ffffff;
        }

        .btn-reset:hover {
            background: #3c4148;
        }

        .btn-download {
            background: #ffffff;
            color: #111111;
        }

        .btn-download:hover {
            background: #e9e9e9;
            transform: translateY(-1px);
        }

        /* =========================
           PREVIEW
        ========================= */

        .preview-panel {
            background: #191c20;

            border-radius: 18px;

            padding: 22px;

            display: flex;
            flex-direction: column;
        }

        .preview-header {
            display: flex;

            justify-content: space-between;
            align-items: center;

            margin-bottom: 15px;
        }

        .preview-header h2 {
            font-size: 19px;
        }

        .status {
            font-size: 12px;
            color: #8e949c;
        }

        .canvas-container {

            width: 100%;

            min-height: 650px;

            background-color: #272a2f;

            /*
            Fundo quadriculado para demonstrar
            transparência.
            */

            background-image:
                linear-gradient(45deg, #32353b 25%, transparent 25%),
                linear-gradient(-45deg, #32353b 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, #32353b 75%),
                linear-gradient(-45deg, transparent 75%, #32353b 75%);

            background-size: 30px 30px;

            background-position:
                0 0,
                0 15px,
                15px -15px,
                -15px 0;

            border-radius: 14px;

            overflow: hidden;

            display: flex;

            align-items: center;
            justify-content: center;
        }

        canvas {

            max-width: 100%;
            max-height: 100%;

            width: auto;
            height: auto;

            display: block;

            cursor: grab;

            touch-action: none;
        }

        canvas:active {
            cursor: grabbing;
        }

        .instructions {

            text-align: center;

            color: #777e87;

            font-size: 12px;

            margin-top: 12px;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 850px) {

            .app {
                grid-template-columns: 1fr;
            }

            .canvas-container {
                min-height: 500px;
            }

        }

    </style>

</head>


<body>


<header>

    <h1>Crie sua foto</h1>

    <p>
        Carregue sua foto e ajuste dentro da moldura
    </p>

</header>



<div class="app">


    <!-- =====================================
         PAINEL DE CONTROLE
    ====================================== -->

    <div class="panel">

        <h2>Personalize sua foto</h2>


        <label
            class="upload-area"
            for="photoInput"
        >

            <strong>
                📷 Carregar minha foto
            </strong>

            <span>
                Clique aqui para selecionar uma imagem
            </span>

        </label>


        <input
            type="file"
            id="photoInput"
            accept="image/jpeg,image/png,image/webp"
        >


        <!-- ZOOM -->

        <div class="control">

            <label>

                <span>
                    Zoom
                </span>

                <span id="zoomValue">
                    100%
                </span>

            </label>


            <input
                type="range"
                id="zoom"
                min="0.5"
                max="4"
                step="0.01"
                value="1"
            >

        </div>



        <!-- ROTAÇÃO -->

        <div class="control">

            <label>

                <span>
                    Rotação
                </span>

                <span id="rotationValue">
                    0°
                </span>

            </label>


            <input
                type="range"
                id="rotation"
                min="-180"
                max="180"
                step="1"
                value="0"
            >

        </div>



        <div class="buttons">

            <button
                class="btn-reset"
                id="resetBtn"
            >
                ↺ Restaurar posição
            </button>


            <button
                class="btn-download"
                id="downloadBtn"
            >
                ↓ Baixar foto final
            </button>

        </div>

    </div>



    <!-- =====================================
         PREVISUALIZAÇÃO
    ====================================== -->

    <div class="preview-panel">


        <div class="preview-header">

            <h2>
                Pré-visualização
            </h2>

            <span
                class="status"
                id="status"
            >
                Nenhuma foto carregada
            </span>

        </div>



        <div class="canvas-container">

            <canvas
                id="canvas"
            ></canvas>

        </div>


        <div class="instructions">

            Arraste a foto para posicionar •
            Use o zoom para aproximar ou afastar

        </div>

    </div>

</div>



<script>


/*
========================================================
URL DA MOLDURA
========================================================

A moldura agora vem diretamente deste endereço.
*/

const FRAME_URL =
"https://iili.io/CQ3GD9R.md.png";


/*
========================================================
ELEMENTOS
========================================================
*/

const canvas =
document.getElementById("canvas");

const ctx =
canvas.getContext("2d");

const photoInput =
document.getElementById("photoInput");

const zoomControl =
document.getElementById("zoom");

const rotationControl =
document.getElementById("rotation");

const zoomValue =
document.getElementById("zoomValue");

const rotationValue =
document.getElementById("rotationValue");

const resetBtn =
document.getElementById("resetBtn");

const downloadBtn =
document.getElementById("downloadBtn");

const status =
document.getElementById("status");


/*
========================================================
IMAGENS
========================================================
*/

const frame =
new Image();

/*
Permite que o navegador tente carregar
a imagem externa para uso no canvas.
*/

frame.crossOrigin = "anonymous";

frame.src = FRAME_URL;


let photo = null;


/*
========================================================
POSIÇÃO DA FOTO
========================================================
*/

let photoX = 0;

let photoY = 0;

let zoom = 1;

let rotation = 0;


/*
========================================================
DRAG
========================================================
*/

let dragging = false;

let startMouseX = 0;

let startMouseY = 0;

let startPhotoX = 0;

let startPhotoY = 0;


/*
========================================================
CARREGAMENTO DA MOLDURA
========================================================
*/

frame.onload = function () {

    canvas.width =
        frame.naturalWidth;

    canvas.height =
        frame.naturalHeight;


    /*
    Centraliza a foto.
    */

    photoX =
        canvas.width / 2;

    photoY =
        canvas.height / 2;


    draw();

};


frame.onerror = function () {

    status.textContent =
        "Erro ao carregar a moldura";

    console.error(
        "Não foi possível carregar a moldura."
    );

};


/*
========================================================
CARREGAR FOTO
========================================================
*/

photoInput.addEventListener(
    "change",
    function(event) {

        const file =
            event.target.files[0];

        if (!file)
            return;


        const reader =
            new FileReader();


        reader.onload =
        function(e) {

            const img =
                new Image();


            img.onload =
            function() {

                photo = img;


                /*
                ======================================
                POSIÇÃO INICIAL
                ======================================
                */

                photoX =
                    canvas.width / 2;

                photoY =
                    canvas.height / 2;


                /*
                ======================================
                ZOOM INICIAL
                ======================================
                */

                zoom = 1;

                rotation = 0;


                zoomControl.value =
                    zoom;

                rotationControl.value =
                    rotation;


                status.textContent =
                    "Foto carregada";


                updateLabels();

                draw();

            };


            img.src =
                e.target.result;

        };


        reader.readAsDataURL(file);

    }
);


/*
========================================================
DESENHAR COMPOSIÇÃO
========================================================
*/

function draw() {


    if (!frame.complete)
        return;


    /*
    Limpa canvas
    */

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    /*
    ====================================================
    FOTO DO USUÁRIO
    ====================================================
    */

    if (photo) {

        ctx.save();


        /*
        Move para o centro da foto
        */

        ctx.translate(
            photoX,
            photoY
        );


        /*
        Rotação
        */

        ctx.rotate(
            rotation *
            Math.PI /
            180
        );


        /*
        =================================================
        ESCALA

        Faz a foto cobrir todo o canvas.
        =================================================
        */

        const scaleX =
            canvas.width /
            photo.width;

        const scaleY =
            canvas.height /
            photo.height;


        const baseScale =
            Math.max(
                scaleX,
                scaleY
            );


        const finalScale =
            baseScale *
            zoom;


        const width =
            photo.width *
            finalScale;


        const height =
            photo.height *
            finalScale;


        /*
        Desenha centralizada
        */

        ctx.drawImage(
            photo,

            -width / 2,
            -height / 2,

            width,
            height
        );


        ctx.restore();

    }


    /*
    ====================================================
    MOLDURA
    ====================================================

    ESTA É A PARTE MAIS IMPORTANTE.

    A moldura é desenhada DEPOIS da fotografia.

    Portanto todos os elementos da moldura ficam
    visualmente sobre a fotografia.
    ====================================================
    */

    ctx.drawImage(
        frame,

        0,
        0,

        canvas.width,
        canvas.height
    );

}


/*
========================================================
ZOOM
========================================================
*/

zoomControl.addEventListener(
    "input",
    function() {

        zoom =
            parseFloat(
                this.value
            );

        updateLabels();

        draw();

    }
);


/*
========================================================
ROTAÇÃO
========================================================
*/

rotationControl.addEventListener(
    "input",
    function() {

        rotation =
            parseFloat(
                this.value
            );

        updateLabels();

        draw();

    }
);


/*
========================================================
ATUALIZAR INDICADORES
========================================================
*/

function updateLabels() {

    zoomValue.textContent =
        Math.round(
            zoom * 100
        ) + "%";


    rotationValue.textContent =
        rotation + "°";

}


/*
========================================================
ARRASTAR COM MOUSE
========================================================
*/

canvas.addEventListener(
    "mousedown",
    function(event) {

        if (!photo)
            return;


        dragging = true;


        startMouseX =
            event.clientX;

        startMouseY =
            event.clientY;


        startPhotoX =
            photoX;

        startPhotoY =
            photoY;

    }
);


window.addEventListener(
    "mousemove",
    function(event) {

        if (!dragging)
            return;


        const rect =
            canvas.getBoundingClientRect();


        const scaleX =
            canvas.width /
            rect.width;


        const scaleY =
            canvas.height /
            rect.height;


        const deltaX =
            (event.clientX -
             startMouseX)
            * scaleX;


        const deltaY =
            (event.clientY -
             startMouseY)
            * scaleY;


        photoX =
            startPhotoX +
            deltaX;


        photoY =
            startPhotoY +
            deltaY;


        draw();

    }
);


window.addEventListener(
    "mouseup",
    function() {

        dragging = false;

    }
);


/*
========================================================
TOUCH / CELULAR
========================================================
*/

canvas.addEventListener(
    "touchstart",
    function(event) {

        if (!photo)
            return;


        const touch =
            event.touches[0];


        dragging = true;


        startMouseX =
            touch.clientX;

        startMouseY =
            touch.clientY;


        startPhotoX =
            photoX;

        startPhotoY =
            photoY;

    },
    {
        passive: true
    }
);


canvas.addEventListener(
    "touchmove",
    function(event) {

        if (!dragging)
            return;


        const touch =
            event.touches[0];


        const rect =
            canvas.getBoundingClientRect();


        const scaleX =
            canvas.width /
            rect.width;


        const scaleY =
            canvas.height /
            rect.height;


        photoX =
            startPhotoX +
            (touch.clientX -
             startMouseX) *
            scaleX;


        photoY =
            startPhotoY +
            (touch.clientY -
             startMouseY) *
            scaleY;


        draw();

    },
    {
        passive: true
    }
);


canvas.addEventListener(
    "touchend",
    function() {

        dragging = false;

    }
);


/*
========================================================
RESTAURAR
========================================================
*/

resetBtn.addEventListener(
    "click",
    function() {

        if (!photo)
            return;


        zoom = 1;

        rotation = 0;


        photoX =
            canvas.width / 2;

        photoY =
            canvas.height / 2;


        zoomControl.value =
            zoom;

        rotationControl.value =
            rotation;


        updateLabels();

        draw();

    }
);


/*
========================================================
DOWNLOAD
========================================================
*/

downloadBtn.addEventListener(
    "click",
    function() {

        if (!photo) {

            alert(
                "Primeiro carregue sua foto."
            );

            return;

        }


        /*
        =================================================
        EXPORTAÇÃO

        O canvas já contém:

        CAMADA 1 → Foto do usuário
        CAMADA 2 → Moldura PNG

        Portanto exportamos o canvas inteiro.
        =================================================
        */


        canvas.toBlob(
            function(blob) {

                if (!blob) {

                    alert(
                        "Não foi possível gerar a imagem."
                    );

                    return;

                }


                const url =
                    URL.createObjectURL(
                        blob
                    );


                const link =
                    document.createElement(
                        "a"
                    );


                link.href =
                    url;


                link.download =
                    "eu-voto-foto.png";


                document.body.appendChild(
                    link
                );


                link.click();


                document.body.removeChild(
                    link
                );


                URL.revokeObjectURL(
                    url
                );

            },

            "image/png"

        );

    }
);


/*
========================================================
INICIALIZAÇÃO
========================================================
*/

updateLabels();

</script>

</body>

</html>
