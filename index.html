<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Editor de Foto</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #101114;
            color: #fff;
            min-height: 100vh;
        }

        header {
            text-align: center;
            padding: 30px 20px 20px;
        }

        header h1 {
            font-size: 30px;
            margin-bottom: 8px;
        }

        header p {
            color: #aaa;
            font-size: 15px;
        }

        .app {
            width: min(1200px, 95%);
            margin: auto;
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 25px;
            padding-bottom: 40px;
        }

        /* PAINEL */

        .panel {
            background: #1b1d21;
            border-radius: 18px;
            padding: 22px;
            box-shadow: 0 15px 40px rgba(0,0,0,.35);
        }

        .panel h2 {
            font-size: 18px;
            margin-bottom: 20px;
        }

        .upload-area {
            border: 2px dashed #555;
            border-radius: 14px;
            padding: 25px 15px;
            text-align: center;
            cursor: pointer;
            transition: .2s;
            margin-bottom: 25px;
        }

        .upload-area:hover {
            border-color: #fff;
            background: #24262b;
        }

        .upload-area strong {
            display: block;
            margin-bottom: 8px;
        }

        .upload-area span {
            color: #999;
            font-size: 13px;
        }

        input[type="file"] {
            display: none;
        }

        .control {
            margin-bottom: 22px;
        }

        .control label {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            margin-bottom: 9px;
            color: #ddd;
        }

        input[type="range"] {
            width: 100%;
            cursor: pointer;
        }

        .buttons {
            display: grid;
            gap: 10px;
        }

        button {
            border: none;
            border-radius: 10px;
            padding: 13px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: .2s;
        }

        .btn-reset {
            background: #303238;
            color: #fff;
        }

        .btn-reset:hover {
            background: #3c3f46;
        }

        .btn-download {
            background: #fff;
            color: #111;
        }

        .btn-download:hover {
            transform: translateY(-1px);
            background: #e8e8e8;
        }

        /* ÁREA DE PREVISUALIZAÇÃO */

        .preview-panel {
            background: #1b1d21;
            border-radius: 18px;
            padding: 22px;
            display: flex;
            flex-direction: column;
        }

        .preview-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .preview-header h2 {
            font-size: 18px;
        }

        .status {
            font-size: 12px;
            color: #aaa;
        }

        .canvas-container {
            width: 100%;
            flex: 1;
            min-height: 650px;
            background:
                linear-gradient(45deg, #292b30 25%, transparent 25%),
                linear-gradient(-45deg, #292b30 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, #292b30 75%),
                linear-gradient(-45deg, transparent 75%, #292b30 75%);
            background-size: 30px 30px;
            background-position: 0 0, 0 15px, 15px -15px, -15px 0;
            border-radius: 14px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        canvas {
            max-width: 100%;
            max-height: 100%;
            display: block;
            cursor: grab;
        }

        canvas:active {
            cursor: grabbing;
        }

        .instructions {
            text-align: center;
            color: #777;
            font-size: 12px;
            margin-top: 12px;
        }

        @media (max-width: 850px) {

            .app {
                grid-template-columns: 1fr;
            }

            .canvas-container {
                min-height: 500px;
            }

        }
    </style>
</head>

<body>

<header>
    <h1>Editor de Foto</h1>
    <p>Posicione sua foto dentro da moldura</p>
</header>

<div class="app">

    <!-- PAINEL DE CONTROLE -->

    <div class="panel">

        <h2>Configurações</h2>

        <label class="upload-area" for="photoInput">
            <strong>📷 Carregar sua foto</strong>
            <span>Clique aqui para selecionar uma imagem</span>
        </label>

        <input
            type="file"
            id="photoInput"
            accept="image/png,image/jpeg,image/webp"
        >

        <div class="control">

            <label>
                <span>Zoom</span>
                <span id="zoomValue">100%</span>
            </label>

            <input
                type="range"
                id="zoom"
                min="0.2"
                max="4"
                step="0.01"
                value="1"
            >

        </div>

        <div class="control">

            <label>
                <span>Rotação</span>
                <span id="rotationValue">0°</span>
            </label>

            <input
                type="range"
                id="rotation"
                min="-180"
                max="180"
                step="1"
                value="0"
            >

        </div>

        <div class="buttons">

            <button
                class="btn-reset"
                id="resetBtn">
                ↺ Restaurar posição
            </button>

            <button
                class="btn-download"
                id="downloadBtn">
                ↓ Baixar imagem final
            </button>

        </div>

    </div>


    <!-- PREVISUALIZAÇÃO -->

    <div class="preview-panel">

        <div class="preview-header">

            <h2>Pré-visualização</h2>

            <span
                class="status"
                id="status">
                Nenhuma foto carregada
            </span>

        </div>

        <div class="canvas-container">

            <canvas id="canvas"></canvas>

        </div>

        <div class="instructions">
            Arraste a foto para posicionar • Use o controle de zoom para ajustar
        </div>

    </div>

</div>


<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const photoInput = document.getElementById("photoInput");

const zoomControl = document.getElementById("zoom");
const rotationControl = document.getElementById("rotation");

const zoomValue = document.getElementById("zoomValue");
const rotationValue = document.getElementById("rotationValue");

const resetBtn = document.getElementById("resetBtn");
const downloadBtn = document.getElementById("downloadBtn");

const status = document.getElementById("status");


/*
========================================================
CONFIGURAÇÃO DA MOLDURA
========================================================

Coloque o arquivo "moldura.png" na mesma pasta deste HTML.

IMPORTANTE:

A moldura deve possuir transparência (canal alpha).

As partes transparentes permitirão visualizar a foto
do usuário por baixo.

As partes desenhadas da moldura ficarão por cima.
*/

const frame = new Image();

frame.src = "moldura.png";


/*
========================================================
VARIÁVEIS
========================================================
*/

let photo = null;

let photoX = 0;
let photoY = 0;

let zoom = 1;
let rotation = 0;

let dragging = false;

let startMouseX = 0;
let startMouseY = 0;

let startPhotoX = 0;
let startPhotoY = 0;


/*
========================================================
DIMENSÕES DA MOLDURA
========================================================
*/

frame.onload = function () {

    canvas.width = frame.naturalWidth;
    canvas.height = frame.naturalHeight;

    draw();

};


/*
========================================================
CARREGAR FOTO
========================================================
*/

photoInput.addEventListener("change", function(event) {

    const file = event.target.files[0];

    if (!file) return;

    const reader = new FileReader();

    reader.onload = function(e) {

        const img = new Image();

        img.onload = function() {

            photo = img;

            zoom = 1;
            rotation = 0;

            zoomControl.value = zoom;
            rotationControl.value = rotation;

            /*
            Centraliza a foto inicialmente
            */

            photoX = canvas.width / 2;
            photoY = canvas.height / 2;

            status.textContent = "Foto carregada";

            updateLabels();

            draw();

        };

        img.src = e.target.result;

    };

    reader.readAsDataURL(file);

});


/*
========================================================
DESENHAR
========================================================
*/

function draw() {

    if (!frame.complete) return;

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    /*
    ----------------------------------------------
    FUNDO
    ----------------------------------------------
    */

    ctx.save();

    ctx.fillStyle = "#ffffff";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    ctx.restore();


    /*
    ----------------------------------------------
    FOTO DO USUÁRIO
    ----------------------------------------------
    */

    if (photo) {

        ctx.save();

        ctx.translate(
            photoX,
            photoY
        );

        ctx.rotate(
            rotation * Math.PI / 180
        );

        /*
        Calcula escala para que a imagem
        cubra adequadamente a moldura.
        */

        const baseScale = Math.max(
            canvas.width / photo.width,
            canvas.height / photo.height
        );

        const scale = baseScale * zoom;

        ctx.drawImage(
            photo,
            -photo.width * scale / 2,
            -photo.height * scale / 2,
            photo.width * scale,
            photo.height * scale
        );

        ctx.restore();

    }


    /*
    ----------------------------------------------
    MOLDURA
    ----------------------------------------------

    MUITO IMPORTANTE:

    A moldura é desenhada DEPOIS da foto.

    Portanto ela sempre fica por cima.
    */

    ctx.drawImage(
        frame,
        0,
        0,
        canvas.width,
        canvas.height
    );

}


/*
========================================================
ZOOM
========================================================
*/

zoomControl.addEventListener("input", function() {

    zoom = parseFloat(this.value);

    updateLabels();

    draw();

});


/*
========================================================
ROTAÇÃO
========================================================
*/

rotationControl.addEventListener("input", function() {

    rotation = parseFloat(this.value);

    updateLabels();

    draw();

});


/*
========================================================
ATUALIZAR TEXTOS
========================================================
*/

function updateLabels() {

    zoomValue.textContent =
        Math.round(zoom * 100) + "%";

    rotationValue.textContent =
        rotation + "°";

}


/*
========================================================
MOUSE - ARRASTAR FOTO
========================================================
*/

canvas.addEventListener("mousedown", function(event) {

    if (!photo) return;

    dragging = true;

    startMouseX = event.clientX;
    startMouseY = event.clientY;

    startPhotoX = photoX;
    startPhotoY = photoY;

});


window.addEventListener("mousemove", function(event) {

    if (!dragging) return;

    const rect = canvas.getBoundingClientRect();

    const scaleX =
        canvas.width / rect.width;

    const scaleY =
        canvas.height / rect.height;

    const deltaX =
        (event.clientX - startMouseX) * scaleX;

    const deltaY =
        (event.clientY - startMouseY) * scaleY;

    photoX =
        startPhotoX + deltaX;

    photoY =
        startPhotoY + deltaY;

    draw();

});


window.addEventListener("mouseup", function() {

    dragging = false;

});


/*
========================================================
TOUCH / CELULAR
========================================================
*/

canvas.addEventListener(
    "touchstart",
    function(event) {

        if (!photo) return;

        const touch = event.touches[0];

        dragging = true;

        startMouseX = touch.clientX;
        startMouseY = touch.clientY;

        startPhotoX = photoX;
        startPhotoY = photoY;

    },
    { passive: true }
);


canvas.addEventListener(
    "touchmove",
    function(event) {

        if (!dragging) return;

        const touch = event.touches[0];

        const rect =
            canvas.getBoundingClientRect();

        const scaleX =
            canvas.width / rect.width;

        const scaleY =
            canvas.height / rect.height;

        photoX =
            startPhotoX +
            (touch.clientX - startMouseX) * scaleX;

        photoY =
            startPhotoY +
            (touch.clientY - startMouseY) * scaleY;

        draw();

    },
    { passive: true }
);


canvas.addEventListener(
    "touchend",
    function() {

        dragging = false;

    }
);


/*
========================================================
RESTAURAR
========================================================
*/

resetBtn.addEventListener("click", function() {

    if (!photo) return;

    zoom = 1;

    rotation = 0;

    photoX =
        canvas.width / 2;

    photoY =
        canvas.height / 2;

    zoomControl.value = zoom;

    rotationControl.value = rotation;

    updateLabels();

    draw();

});


/*
========================================================
DOWNLOAD
========================================================
*/

downloadBtn.addEventListener("click", function() {

    if (!photo) {

        alert("Primeiro carregue uma foto.");

        return;

    }

    /*
    O canvas já contém:

    1. Foto do usuário
    2. Moldura PNG por cima

    Portanto basta exportar.
    */

    canvas.toBlob(
        function(blob) {

            const url =
                URL.createObjectURL(blob);

            const link =
                document.createElement("a");

            link.href = url;

            link.download =
                "foto-com-moldura.png";

            document.body.appendChild(link);

            link.click();

            document.body.removeChild(link);

            URL.revokeObjectURL(url);

        },
        "image/png"
    );

});


/*
========================================================
INICIALIZAÇÃO
========================================================
*/

updateLabels();

</script>

</body>
</html>
