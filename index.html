<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Gerador de Moldura</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" />
</head>
<body class="bg-slate-100 p-4 flex justify-center">
    <div class="bg-white p-6 rounded-xl shadow-lg w-full max-w-md">
        <input type="file" id="upload-input" accept="image/*" class="mb-4 block w-full text-sm">
        
        <div id="editor-container" class="hidden relative w-full aspect-square bg-gray-200 overflow-hidden mb-4">
            <img id="image-to-crop" class="max-w-full">
            <!-- Moldura -->
            <img id="frame-overlay" 
                 src="https://ibb.co/fdq2frBw" 
                 crossorigin="anonymous" 
                 class="absolute inset-0 w-full h-full pointer-events-none z-10">
        </div>

        <button id="download-btn" class="hidden w-full bg-blue-600 text-white py-2 rounded-lg">Baixar Imagem Final</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
    <script>
        const upload = document.getElementById('upload-input');
        const img = document.getElementById('image-to-crop');
        const frame = document.getElementById('frame-overlay');
        const btn = document.getElementById('download-btn');
        let cropper;

        upload.onchange = (e) => {
            const reader = new FileReader();
            reader.onload = (event) => {
                img.src = event.target.result;
                document.getElementById('editor-container').classList.remove('hidden');
                btn.classList.remove('hidden');
                if(cropper) cropper.destroy();
                cropper = new Cropper(img, { aspectRatio: 1, viewMode: 1 });
            };
            reader.readAsDataURL(e.target.files[0]);
        };

        btn.onclick = () => {
            const canvas = cropper.getCroppedCanvas({ width: 1080, height: 1080 });
            const ctx = canvas.getContext('2d');
            
            // Recriando a imagem da moldura para garantir o CORS
            const imgFrame = new Image();
            imgFrame.crossOrigin = "anonymous";
            imgFrame.src = frame.src + "?" + new Date().getTime(); // Cache buster
            
            imgFrame.onload = () => {
                ctx.drawImage(imgFrame, 0, 0, 1080, 1080);
                const link = document.createElement('a');
                link.download = 'foto-moldura.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
            };
            
            imgFrame.onerror = () => {
                alert("Erro: O servidor da imagem não permitiu o acesso (CORS). Tente hospedar a moldura em outro local.");
            };
        };
    </script>
</body>
</html>
