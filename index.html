<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Combinar Imagens Corrigido</title>
    <style>
        body { font-family: sans-serif; text-align: center; background-color: #f4f4f9; padding: 20px; }
        .container { max-width: 650px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        #meuCanvas { border: 1px solid #ccc; max-width: 100%; height: auto; margin-top: 15px; cursor: move; display: block; margin-left: auto; margin-right: auto; background-color: #f9f9f9; }
        .controles { margin-top: 15px; display: none; background: #eee; padding: 15px; border-radius: 5px; }
        .controle-grupo { margin-bottom: 10px; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .btn { padding: 10px 20px; background-color: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; text-decoration: none; display: inline-block; margin-top: 15px; font-weight: bold; font-size: 16px; }
        .btn:hover { background-color: #218838; }
        .btn-filtro { padding: 5px 10px; border: 1px solid #ccc; background: white; cursor: pointer; border-radius: 3px; }
        .btn-filtro.ativo { background: #007bff; color: white; border-color: #007bff; }
        .dica { font-size: 13px; color: #666; margin-top: 5px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Personalize sua Foto</h2>
    
    <p class="dica">1. Selecione sua foto abaixo</p>
    <input type="file" id="uploadFoto" accept="image/*">
    <br>
    
    <canvas id="meuCanvas" width="600" height="600"></canvas>
    
    <div id="painelControles" class="controles">
        <div class="controle-grupo">
            <label for="rangeZoom">🔍 Zoom:</label>
            <input type="range" id="rangeZoom" min="0.1" max="3" step="0.01" value="1">
        </div>
        <div class="controle-grupo">
            <span>🎨 Filtros:</span>
            <button class="btn-filtro ativo" onclick="mudarFiltro('normal', this)">Original</button>
            <button class="btn-filtro" onclick="mudarFiltro('pb', this)">P&B</button>
            <button class="btn-filtro" onclick="mudarFiltro('sepia', this)">Sépia</button>
        </div>
        <p class="dica">💡 Clique e arraste a imagem para ajustar a posição.</p>
    </div>
    
    <a id="btnBaixar" class="btn" style="display: none;" download="foto-com-moldura.png">Baixar Imagem Final</a>
</div>
