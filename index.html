<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Moldura</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" />
</head>
<body class="bg-slate-100 min-h-screen flex flex-col items-center justify-center p-4">

    <div class="bg-white shadow-xl rounded-2xl p-6 w-full max-w-xl">
        <h1 class="text-2xl font-bold text-slate-800 text-center mb-2">Adicione sua Moldura</h1>

        <!-- Etapa 1: Upload -->
        <div id="upload-section" class="mb-6">
            <label class="flex flex-col items-center justify-center border-2 border-dashed border-slate-300 rounded-xl p-6 cursor-pointer hover:border-indigo-500 transition-colors bg-slate-50">
                <span class="text-sm font-medium text-slate-600">Clique aqui para enviar sua foto</span>
                <input type="file" id="upload-input" accept="image/*" class="hidden">
            </label>
        </div>

        <!-- Etapa 2: Editor -->
        <div id="editor-section" class="hidden flex-col items-center">
            <div class="relative w-full max-w-[400px] aspect-square bg-slate-200 rounded-lg overflow-hidden shadow-inner mb-4">
                <img id="image-to-crop" class="max-w-full block" alt="Foto para ajuste">
                
                <!-- Moldura Fixa (Link atualizado) -->
                <img id="frame-overlay" 
                     src="https://www.image2url.com/r2/default/images/1787190565921-f7dd210d-b8eb-424f-bb76-d79ded28c0f3.png" 
                     crossorigin="anonymous"
                     class="absolute inset-0 w-full h-full pointer-events-none z-10 object-contain" alt="Moldura">
            </div>

            <div class="flex gap-2 w-full max-w-[400px] mb-4">
                <button onclick="zoomIn()" class="flex-1 bg-slate-200 py-2 rounded-lg text-sm">Zoom +</button>
                <button onclick="zoomOut()" class="flex-1 bg-slate-200 py-2 rounded-lg text-sm">Zoom -</button>
            </div>

            <button id="download-btn" class="w-full max-w-[400px] bg-indigo-600 text-white font-semibold py-3 rounded-xl">
                Baixar Imagem Pronta
            </button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
    <script>
        const uploadInput = document.getElementById('upload-input');
        const editorSection = document.getElementById('editor-section');
        const imageToCrop = document.getElementById('image-to-crop');
        const frameOverlay = document.getElementById('frame-overlay');
        const downloadBtn = document.getElementById('download-btn');
        let cropper = null;

        uploadInput.addEventListener('change', (e) => {
            const reader = new FileReader();
            reader.onload = (event) => {
                imageToCrop.src = event.target.result;
                document.getElementById('upload-section').classList.add('hidden');
                editorSection.classList.remove('hidden');
                editorSection.classList.add('flex');

                if (cropper) cropper.destroy();
                cropper = new Cropper(imageToCrop, {
                    aspectRatio: 1,
                    viewMode: 1,
                    dragMode: 'move',
                    guides: false,
                    cropBoxMovable: false,
                    cropBoxResizable: false,
                });
            };
            reader.readAsDataURL(e.target.files[0]);
        });

        function zoomIn() { if (cropper) cropper.zoom(0.1); }
        function zoomOut() { if (cropper) cropper.zoom(-0.1); }

        downloadBtn.addEventListener('click', () => {
            const canvas = cropper.getCroppedCanvas({ width: 1080, height: 1080 });
            const ctx = canvas.getContext('2d');
            
            const frame = new Image();
            frame.crossOrigin = "anonymous";
            frame.src = frameOverlay.src;
            
            frame.onload = () => {
                ctx.drawImage(frame, 0, 0, canvas.width, canvas.height);
                const link = document.createElement('a');
                link.download = 'minha-foto-com-moldura.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
            };
        });
    </script>
</body>
</html>
